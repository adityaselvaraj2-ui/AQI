name: Sync backend to Hugging Face Space

# Builds the Space payload (Dockerfile + requirements at root, backend/ + llm/)
# from the tracked tree and pushes it to the Space git repo. The Space always
# reflects main; weights are NOT included — the Space fetches them from the
# HF model repo at runtime (MODEL_SOURCE=hf).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hf-space-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'TECHTITANS07X/AIRLENS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the Space tree
        run: |
          mkdir -p /tmp/space
          cp deploy/hf-space/Dockerfile /tmp/space/Dockerfile
          cp deploy/hf-space/requirements-space.txt /tmp/space/requirements-space.txt
          cp deploy/hf-space/README.md /tmp/space/README.md
          cp -r backend /tmp/space/backend
          cp -r llm /tmp/space/llm
          printf 'synced from %s\n' "$GITHUB_SHA" > /tmp/space/SYNC.txt

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}          # HF write token (repo secret)
          HF_SPACE: ${{ vars.HF_SPACE_REPO }}        # e.g. techtitans07x/airlens-api (repo variable)
        run: |
          if [ -z "$HF_SPACE" ]; then
            echo "::error::Set the repository variable HF_SPACE_REPO (owner/space-name)."
            exit 1
          fi
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Set the repository secret HF_TOKEN."
            exit 1
          fi
          cd /tmp/space
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "sync $GITHUB_SHA"
          git remote add space "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"
          git push -q --force space main
          echo "Synced to https://huggingface.co/spaces/${HF_SPACE}"
